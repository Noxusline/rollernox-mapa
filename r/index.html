<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Ruta en RollerNox</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #050C08; color: #E7F5EC; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 360px; padding: 24px; text-align: center; }
  h1 { font-size: 22px; margin: 0 0 8px; color: #34D399; }
  p { margin: 8px 0; color: #A7C4B3; }
  a.btn { display: block; margin: 20px 0 8px; padding: 14px 18px; border-radius: 12px; background: #10B981;
          color: #03140B; font-weight: 800; text-decoration: none; }
  small { color: #6B8F7A; }
</style>
</head>
<body>
<main>
  <h1>Te compartieron una ruta</h1>
  <p>Se abre en la app <b>RollerNox</b>. Si no se abrió sola, tocá el botón.</p>
  <a class="btn" id="open" href="#">Abrir en RollerNox</a>
  <p id="msg"></p>
  <small>Necesitás la app instalada y una cuenta para ver la ruta.</small>
</main>
<script>
  // Esta página solo pasa el link a la app (rollernox://ruta/<id>); no guarda ni muestra datos.
  (function () {
    var id = new URLSearchParams(location.search).get('id') || '';
    var msg = document.getElementById('msg');
    var btn = document.getElementById('open');
    if (!/^[fgs]-[0-9a-zA-Z-]{1,64}$/.test(id)) {
      msg.textContent = 'El link está incompleto. Pedile a quien te lo mandó que lo comparta de nuevo.';
      btn.style.display = 'none';
      return;
    }
    var app = 'rollernox://ruta/' + id;
    var android = /Android/i.test(navigator.userAgent);
    // En Android, el formato "intent" abre la app o, si no está instalada, vuelve a esta página.
    var href = android
      ? 'intent://ruta/' + id + '#Intent;scheme=rollernox;package=com.noxusline.rollernox;S.browser_fallback_url=' +
        encodeURIComponent(location.href.split('#')[0] + '#sin-app') + ';end'
      : app;
    btn.href = href;
    if (location.hash === '#sin-app') {
      msg.textContent = 'Parece que no tenés RollerNox instalada todavía.';
      return;
    }
    setTimeout(function () { location.href = href; }, 300);
  })();
</script>
</body>
</html>
